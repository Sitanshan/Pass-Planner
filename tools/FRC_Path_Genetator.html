<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRC Pass Planner v19.7 (Segment Simulation)</title>
    <style>
        /* ==========================================
           🌌 赛博朋克 霓虹科技感主题 (Cyberpunk Neon Theme)
           ========================================== */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --neon-red: #ff2a2a;
            --bg-dark: #0a0b10;
            --panel-bg: rgba(12, 16, 28, 0.75);
        }

        body { 
            font-family: 'Rajdhani', 'Segoe UI', sans-serif; 
            background-color: var(--bg-dark); 
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            color: #d4d4d4; 
            display: flex; padding: 20px; gap: 30px; margin: 0; box-sizing: border-box; height: 100vh; overflow: hidden; 
        }

        .left-panel { width: 323px; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        
        #fieldCanvas { 
            background-color: #111; 
            border: 2px solid var(--neon-cyan); 
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1); 
            border-radius: 6px; 
            max-width: 100%;
            max-height: calc(100vh - 100px);
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto; 
        }

        .tip { 
            font-family: 'Orbitron', sans-serif;
            font-size: 13px; 
            color: var(--neon-cyan); 
            text-align: center; 
            line-height: 1.6; 
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 8px;
            border-radius: 4px;
        }

        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 10px; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; box-shadow: 0 0 5px var(--neon-cyan); }

        .controls-card { 
            background: var(--panel-bg); 
            backdrop-filter: blur(8px);
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid rgba(0, 243, 255, 0.3); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; 
        }

        .control-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .control-group { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #fff;}
        
        .control-group input[type="text"], .control-group input[type="number"], select { 
            background-color: rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--neon-cyan); 
            color: var(--neon-cyan); 
            padding: 6px 10px; 
            border-radius: 4px; 
            font-family: 'Orbitron', monospace;
            font-size: 13px; 
            outline: none; 
            transition: 0.3s;
        }
        .control-group input:focus, select:focus { box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); background-color: rgba(0, 243, 255, 0.1); }
        .control-group input[type="number"] { text-align: center; }

        input[type="range"] { -webkit-appearance: none; width: 100px; background: transparent; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--neon-cyan); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--neon-cyan); }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #333; border-radius: 2px; border: 1px solid rgba(0, 243, 255, 0.3); }

        textarea { 
            flex: 1; background-color: rgba(5, 5, 10, 0.85); color: var(--neon-green); 
            font-family: 'Consolas', 'Courier New', Courier, monospace; padding: 15px; 
            border: 1px solid var(--neon-green); border-radius: 8px; font-size: 14px; 
            resize: none; white-space: pre; min-height: 200px; 
            box-shadow: inset 0 0 15px rgba(57, 255, 20, 0.1); text-shadow: 0 0 3px rgba(57, 255, 20, 0.5);
        }

        button { 
            background-color: rgba(0, 0, 0, 0.6); border: 1px solid currentColor; padding: 8px 15px; 
            cursor: pointer; font-size: 14px; font-family: 'Rajdhani', sans-serif; font-weight: 700;
            letter-spacing: 1px; border-radius: 4px; transition: all 0.2s ease-in-out; text-transform: uppercase;
        }
        button { color: var(--neon-cyan); box-shadow: 0 0 5px rgba(0, 243, 255, 0.2), inset 0 0 5px rgba(0, 243, 255, 0.1); }
        button:hover { background-color: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        button.btn-danger { color: var(--neon-red); border-color: var(--neon-red); box-shadow: 0 0 5px rgba(255, 42, 42, 0.2); }
        button.btn-danger:hover { background-color: var(--neon-red); color: #fff; box-shadow: 0 0 15px var(--neon-red); }
        button.btn-warning { color: var(--neon-yellow); border-color: var(--neon-yellow); box-shadow: 0 0 5px rgba(255, 230, 0, 0.2); }
        button.btn-warning:hover { background-color: var(--neon-yellow); color: #000; box-shadow: 0 0 15px var(--neon-yellow); }
        button.btn-deploy { color: var(--neon-magenta); border-color: var(--neon-magenta); box-shadow: 0 0 8px rgba(255, 0, 255, 0.3); font-size: 15px;}
        button.btn-deploy:hover { background-color: var(--neon-magenta); color: #fff; box-shadow: 0 0 20px var(--neon-magenta); }
        button.btn-sim { background-color: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); border-color: var(--neon-cyan); font-size: 15px; }
        button.btn-sim:hover { background-color: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }
        button.btn-pid { color: #ff5722; border-color: #ff5722; }
        button.btn-pid:hover { background-color: #ff5722; color: #fff; box-shadow: 0 0 15px #ff5722; }
        button.btn-folder { color: #4dabf7; border-color: #4dabf7; }
        button.btn-folder:hover { background-color: #4dabf7; color: #000; box-shadow: 0 0 15px #4dabf7; }
        button.btn-secondary { color: #adb5bd; border-color: #adb5bd; }
        button.btn-secondary:hover { background-color: #adb5bd; color: #000; box-shadow: 0 0 10px #adb5bd; }
        .divider { width: 1px; height: 24px; background-color: rgba(255,255,255,0.1); margin: 0 5px; }

        /* ==========================================
           🚀 核心视觉架构：时间轴节点与路径UI (Timeline)
           ========================================== */
        #timelineContainer { display: flex; flex-direction: column; gap: 8px; }

        .node-item { 
            background: rgba(57, 255, 20, 0.05); border: 1px solid rgba(57, 255, 20, 0.3); 
            border-radius: 6px; padding: 12px; transition: 0.3s; 
        }
        .node-item:hover, .node-item.active { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(57, 255, 20, 0.2); }
        .node-header { 
            color: var(--neon-green); font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 15px; 
            margin-bottom: 10px; border-bottom: 1px solid rgba(57, 255, 20, 0.2); padding-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .segment-item { 
            background: rgba(0, 243, 255, 0.05); border: 1px dashed rgba(0, 243, 255, 0.4); 
            border-radius: 6px; padding: 10px; margin-left: 30px; margin-right: 10px; 
            transition: 0.3s; position: relative;
        }
        .segment-item::before { content: ''; position: absolute; left: -15px; top: -10px; bottom: -10px; width: 2px; background: rgba(0, 243, 255, 0.3); }
        .segment-item:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .segment-header { color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .timeline-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .timeline-controls .form-group { flex: 1; min-width: 70px; margin-bottom: 0; }
        .timeline-controls input, .timeline-controls select { 
            width: 100%; box-sizing: border-box; background-color: rgba(0,0,0,0.8); 
            border: 1px solid #555; color: #fff; padding: 4px 6px; font-family: 'Orbitron', sans-serif;
            border-radius: 3px; outline: none;
        }
        .node-item .timeline-controls input { border-color: rgba(57, 255, 20, 0.4); }
        .node-item .timeline-controls input:focus { box-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }
        .segment-item .timeline-controls input, .segment-item .timeline-controls select { border-color: rgba(0, 243, 255, 0.4); }
        
        .btn-icon { background: transparent; border: none; font-size: 14px; cursor: pointer; padding: 2px 6px; box-shadow: none; color: white;}
        .btn-icon:hover { background: rgba(255,255,255,0.2); }
        .btn-icon.danger:hover { background: var(--neon-red); }

        .inline-checkbox { display: flex; align-items: center; gap: 5px; cursor: pointer; background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; border: 1px solid #555;}
        .inline-checkbox input { width: 14px; height: 14px; cursor: pointer;}
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-card { background-color: var(--panel-bg); border: 1px solid var(--neon-cyan); border-radius: 8px; width: 320px; padding: 25px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px;}
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; color: #a0a0a0; font-weight: 600;}
        .form-group input { padding: 6px; }
    </style>
</head>
<body>

    <div class="left-panel">
        <canvas id="fieldCanvas" width="323" height="662"></canvas>
        <div class="tip" id="statusTip">SYSTEM.READY // PASS PLANNER<br><span style="color:#888">Y=0 Driver Station | X=17.55 Far End</span></div>
    </div>

    <div class="right-panel">
        <div class="controls-card">
            <div class="control-row">
                <div class="control-group">
                    <label>🏟️ FIELD：</label>
                    <select id="fieldSelect">
                        <option value="field2026.png">2026 REEFSCAPE</option>
                        <option value="field2025.png">2025 CRESENDO</option>
                        <option value="field_custom.png">CUSTOM</option>
                    </select>
                </div>
                <div class="divider"></div>
                <div class="control-group" title="Input Field Length and Width in Meters">
                    <label>🗺️ DIM (m)：</label>
                    <input type="number" id="fieldLength" value="17.55" step="0.01" style="width: 55px;" oninput="updateFieldSize()">
                    <span style="color: #666;">×</span>
                    <input type="number" id="fieldWidth" value="8.05" step="0.01" style="width: 55px;" oninput="updateFieldSize()">
                </div>
                <div class="divider"></div>
                <div class="control-group">
                    <label>🤖 ROBOT：</label>
                    <input type="number" id="robotLength" value="0.76" step="0.01" style="width: 50px;" oninput="drawPoints()">
                    <span style="color: #666;">×</span>
                    <input type="number" id="robotWidth" value="0.76" step="0.01" style="width: 50px;" oninput="drawPoints()">
                </div>
            </div>
            
            <div class="control-row">
                <div class="control-group" title="全局默认张力 (将被分段配置覆盖)">
                    <label style="color:var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan);">🪢 GLOBAL TENSION：</label>
                    <input type="range" id="curveWeightSlider" min="0.01" max="1.5" step="0.01" value="0.4" oninput="syncCurveWeight('slider')">
                    <input type="number" id="curveWeightInput" value="0.4" step="0.01" style="width: 50px;" oninput="syncCurveWeight('input')">
                </div>
                <div style="flex: 1;"></div> 
                <button class="btn-pid" onclick="openPidModal()">⚙️ BRAKE PID</button>
                <button class="btn-sim" id="btnSimulate" onclick="toggleSimulation()">▶️ SIMULATE</button>
                <button class="btn-danger" onclick="clearPoints()">🗑️ PURGE ALL</button>
            </div>
            
            <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; margin: 5px 0;">
            <div class="control-row">
                <div class="control-group"><label>📝 ID：</label><input type="text" id="saveNameInput" placeholder="Auto_Path" style="width: 120px;"><button class="btn-warning" onclick="savePathToLocal()">💾 CACHE</button></div>
                <div class="divider"></div>
                <div class="control-group"><select id="savedPathsDropdown" style="width: 120px;"><option value="">-- DB LOAD --</option></select><button onclick="loadPathFromLocal()">📂 LOAD</button><button class="btn-danger" onclick="deletePathFromLocal()">DEL</button></div>
            </div>
            <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; margin: 5px 0;">
            <div class="control-row">
                <div class="control-group"><button id="btnBindFolder" class="btn-folder" onclick="bindProjectFolder()">📁 BIND DEPLOY DIR</button><span id="folderStatus" style="font-size: 12px; color: #888;">No Directory Bound.</span></div>
                <div style="flex: 1;"></div> 
                <div class="control-group">
                    <button class="btn-secondary" onclick="document.getElementById('importFile').click()">⬆️ IMPORT JSON</button>
                    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importJSON(event)">
                    <button class="btn-deploy" onclick="exportRobotJSON()">🚀 EXPORT TO ROBOT</button>
                </div>
            </div>
        </div>

        <div class="controls-card" id="timelineCard" style="display: none; padding: 15px;">
            <div style="color: var(--neon-yellow); font-family: 'Orbitron'; font-weight: bold; margin-bottom: 10px; font-size: 15px;">
                📜 ROUTE TIMELINE
                <span style="font-size: 11px; color:#aaa; font-weight: normal; margin-left:10px;">Click canvas to add nodes.</span>
            </div>
            <div id="timelineContainer">
                <!-- 动态生成的 Node 与 Path 交织列表 -->
            </div>
        </div>

        <textarea id="outputCode" readonly></textarea>
    </div>

    <!-- PID 弹窗保留 -->
    <div id="pidModal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="color: #ff5722; border-color: #ff5722;">⚙️ PID TUNER</h3>
            <div class="form-row"><div class="form-group"><label>Proportional (kP):</label><input type="number" id="pidP" step="0.1" value="4.5"></div></div>
            <div class="form-row"><div class="form-group"><label>Integral (kI):</label><input type="number" id="pidI" step="0.01" value="0.1"></div></div>
            <div class="form-row"><div class="form-group"><label>Derivative (kD):</label><input type="number" id="pidD" step="0.01" value="0.1"></div></div>
            <div style="display:flex; justify-content: flex-end; gap:10px; margin-top:15px;">
                <button class="btn-secondary" onclick="closePidModal()">CANCEL</button>
                <button onclick="savePidData()">CONFIRM</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fieldCanvas'); const ctx = canvas.getContext('2d'); const output = document.getElementById('outputCode'); const fieldSelect = document.getElementById('fieldSelect'); const robotLengthInput = document.getElementById('robotLength'); const robotWidthInput = document.getElementById('robotWidth'); const saveNameInput = document.getElementById('saveNameInput'); const savedPathsDropdown = document.getElementById('savedPathsDropdown'); const btnSimulate = document.getElementById('btnSimulate'); const statusTip = document.getElementById('statusTip');
        const curveWeightInput = document.getElementById('curveWeightInput'); const curveWeightSlider = document.getElementById('curveWeightSlider');
        const pidModal = document.getElementById('pidModal'); const pidP = document.getElementById('pidP'); const pidI = document.getElementById('pidI'); const pidD = document.getElementById('pidD');
        
        let FIELD_WIDTH = 17.55; let FIELD_HEIGHT = 8.05; 
        const LOCAL_STORAGE_KEY = "frc_architect_paths";

        let keyWaypoints = []; let pathSegments = []; let hoveredIndex = -1; let isDragging = false; let draggedIndex = -1; let dragStartX = 0; let dragStartY = 0; let hasDragged = false; 
        let globalBrakePID = { p: 4.5, i: 0.1, d: 0.1 }; let globalCurveWeight = 0.4; 
        
        // 🚀 模拟器全局变量更新，支持单独片段状态管理
        let isSimulating = false; let simPoints = []; let simTotalTime = 0; let simStartTime = 0; let animFrameId = null;
        let activeSimPoints = []; let activeSimTotalTime = 0; // 单独或全局模拟正在使用的数据
        
        let targetDirectoryHandle = null; const bgImg = new Image();

        function getFieldCoords(mouseX, mouseY, rect) { return { x: FIELD_WIDTH - (mouseY / rect.height) * FIELD_WIDTH, y: FIELD_HEIGHT - (mouseX / rect.width) * FIELD_HEIGHT }; }
        function getCanvasCoords(ptX, ptY) { return { px: canvas.width - (ptY / FIELD_HEIGHT) * canvas.width, py: canvas.height - (ptX / FIELD_WIDTH) * canvas.height }; }

        function updateFieldSize() {
            FIELD_WIDTH = parseFloat(document.getElementById('fieldLength').value) || 17.55; FIELD_HEIGHT = parseFloat(document.getElementById('fieldWidth').value) || 8.05;
            canvas.height = canvas.width * (FIELD_WIDTH / FIELD_HEIGHT);
            statusTip.innerHTML = `SYSTEM.READY // PASS PLANNER<br><span style="color:#888">Y=0 Driver Station | X=${FIELD_WIDTH.toFixed(2)} Far End</span>`;
            if(bgImg.complete) { recalculatePath(); drawPoints(); }
        }

        const DB_NAME = "PassPlannerDB"; const STORE_NAME = "SysHandles";
        function initDB() { return new Promise((res, rej) => { let req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME); req.onsuccess = e => res(e.target.result); req.onerror = rej; }); }
        async function saveDirHandleToDB(handle) { let db = await initDB(); let tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).put(handle, 'deployDir'); return tx.complete; }
        async function getDirHandleFromDB() { let db = await initDB(); return new Promise(res => { let req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get('deployDir'); req.onsuccess = e => res(e.target.result); req.onerror = () => res(null); }); }

        window.onload = () => { refreshSavedPathsDropdown(); bgImg.src = fieldSelect.value; updateFieldSize(); getDirHandleFromDB().then(handle => { if (handle) { targetDirectoryHandle = handle; document.getElementById('btnBindFolder').innerText = "✅ BOUND: " + handle.name; document.getElementById('btnBindFolder').style.backgroundColor = "rgba(0, 243, 255, 0.2)"; document.getElementById('folderStatus').innerText = "Directory recovered."; document.getElementById('folderStatus').style.color = "#00f3ff"; } }); };
        fieldSelect.addEventListener('change', () => { bgImg.src = fieldSelect.value; }); bgImg.onload = () => { drawPoints(); };

        function syncCurveWeight(source) { 
            if (source === 'slider') { curveWeightInput.value = curveWeightSlider.value; } 
            else if (source === 'input') { curveWeightSlider.value = curveWeightInput.value; } 
            globalCurveWeight = parseFloat(curveWeightInput.value) || 0.4; 
            keyWaypoints.forEach(pt => {
                if (pt.customTension === undefined) { pt.customTension = (pt.tensionOut !== globalCurveWeight || pt.tensionIn !== globalCurveWeight); }
                if (pt.customTension === false) { pt.tensionOut = globalCurveWeight; pt.tensionIn = globalCurveWeight; }
            });
            renderRouteTimeline(); recalculatePath(); 
        }

        function getSavedPathsObj() { return JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || "{}"); }
        function refreshSavedPathsDropdown() { let pathsObj = getSavedPathsObj(); savedPathsDropdown.innerHTML = '<option value="">-- DB LOAD --</option>'; for (let name in pathsObj) { let opt = document.createElement('option'); opt.value = name; opt.innerText = name; savedPathsDropdown.appendChild(opt); } }
        function savePathToLocal() { let name = saveNameInput.value.trim(); if (!name) return alert("请输入路线名称！"); let pathsObj = getSavedPathsObj(); pathsObj[name] = { waypoints: keyWaypoints, pid: globalBrakePID, curveWeight: globalCurveWeight }; localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(pathsObj)); refreshSavedPathsDropdown(); savedPathsDropdown.value = name; }
        function loadPathFromLocal() { let name = savedPathsDropdown.value; if (!name) return; let data = getSavedPathsObj()[name]; if (data.waypoints) { keyWaypoints = data.waypoints; if (data.pid) globalBrakePID = data.pid; if (data.curveWeight) { globalCurveWeight = data.curveWeight; curveWeightInput.value = globalCurveWeight; curveWeightSlider.value = globalCurveWeight; } } else { keyWaypoints = data; } saveNameInput.value = name; renderRouteTimeline(); recalculatePath(); }
        function deletePathFromLocal() { let name = savedPathsDropdown.value; if (!name) return; if (confirm(`彻底删除缓存 [${name}]？`)) { let pathsObj = getSavedPathsObj(); delete pathsObj[name]; localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(pathsObj)); refreshSavedPathsDropdown(); if (saveNameInput.value === name) saveNameInput.value = ""; clearPoints(); } }

        async function bindProjectFolder() { try { targetDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' }); await saveDirHandleToDB(targetDirectoryHandle); document.getElementById('btnBindFolder').innerText = "✅ BOUND: " + targetDirectoryHandle.name; document.getElementById('btnBindFolder').style.backgroundColor = "rgba(0, 243, 255, 0.2)"; document.getElementById('folderStatus').innerText = "Export will write directly to this path."; document.getElementById('folderStatus').style.color = "#00f3ff"; } catch (err) { console.log("未绑定", err); } }
        async function verifyPermission(fileHandle) { const options = { mode: 'readwrite' }; if ((await fileHandle.queryPermission(options)) === 'granted') { return true; } if ((await fileHandle.requestPermission(options)) === 'granted') { return true; } return false; }
        async function writeToFile(fileName, jsonString) { if (targetDirectoryHandle) { try { const isGranted = await verifyPermission(targetDirectoryHandle); if (!isGranted) throw new Error("Permission Denied"); const fileHandle = await targetDirectoryHandle.getFileHandle(fileName, { create: true }); const writable = await fileHandle.createWritable(); await writable.write(jsonString); await writable.close(); document.getElementById('folderStatus').innerText = `✅ [${fileName}] EXPORTED!`; document.getElementById('folderStatus').style.color = "#39ff14"; setTimeout(() => { document.getElementById('folderStatus').innerText = "Ready."; document.getElementById('folderStatus').style.color = "#00f3ff"; }, 3000); return; } catch (err) { alert("权限拒绝！"); } } let blob = new Blob([jsonString], { type: "application/json" }); let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName; a.click(); }

        async function exportRobotJSON() {
            if (pathSegments.length === 0) return alert("画板为空！"); let name = saveNameInput.value.trim() || "AutoPath"; let fileName = `${name}.json`;
            let robotData = { 
                name: name, brakePID: globalBrakePID, curveWeight: globalCurveWeight, waypoints: keyWaypoints, 
                segments: pathSegments.map((seg, idx) => { 
                    let realIndex = seg.waypointIndex; let p0 = keyWaypoints[realIndex];

        function recalculatePath() {

        // ==========================================
        // 🚀 核心更新：分离的仿真控制逻辑

        function startSimLoop() {

        // 👉 单段独立仿真注入

        function simulateFrame(timestamp) {

            if (elapsed > activeSimTotalTime) { toggleSimulation(); return; } 
            
            statusTip.innerHTML = `⏱️ SIMULATING. TIME: <b style="color:var(--neon-cyan)">${elapsed.toFixed(2)}s</b> / ETA: <b style="color:var(--neon-cyan)">${activeSimTotalTime.toFixed(2)}s</b>`;

        function drawSimulationFrame(robotState, elapsed) { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            if (bgImg.complete && bgImg.src) { ctx.save(); ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate(-Math.PI / 2); ctx.drawImage(bgImg, -canvas.height / 2, -canvas.width / 2, canvas.height, canvas.width); ctx.restore(); } 
            const scale = canvas.height / FIELD_WIDTH; let rLen = parseFloat(robotLengthInput.value) || 0.76; let rWid = parseFloat(robotWidthInput.value) || 0.76; let pxLen = rLen * scale; let pxWid = rWid * scale;

        }
        
        function drawPoints() {
            if(isSimulating) return; ctx.clearRect(0, 0, canvas.width, canvas.height); 
            if (bgImg.complete && bgImg.src) { ctx.save(); ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate(-Math.PI / 2); ctx.drawImage(bgImg, -canvas.height / 2, -canvas.width / 2, canvas.height, canvas.width); ctx.restore(); }

            ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)'; ctx.lineWidth = 1.5; ctx.shadowBlur = 5; ctx.shadowColor = 'rgba(0, 243, 255, 0.3)';
            pathSegments.forEach(seg => { ctx.beginPath(); seg.forEach((pt, index) => { let pos = getCanvasCoords(pt.x, pt.y); if (index === 0) ctx.moveTo(pos.px, pos.py); else ctx.lineTo(pos.px, pos.py); }); ctx.stroke(); }); ctx.shadowBlur = 0;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; pathSegments.forEach(seg => { seg.forEach(pt => { let pos = getCanvasCoords(pt.x, pt.y); ctx.beginPath(); ctx.arc(pos.px, pos.py, 1.5, 0, Math.PI * 2); ctx.fill(); }); }); 
            
            keyWaypoints.forEach((pt, index) => {
                let pos = getCanvasCoords(pt.x, pt.y); let isHover = (index === hoveredIndex); let curRot = pt.rotation !== undefined ? pt.rotation : pt.heading;
                ctx.save(); ctx.translate(pos.px, pos.py); ctx.rotate(-Math.PI / 2 - curRot * Math.PI / 180);
                if (isHover) { ctx.shadowBlur = 18; ctx.shadowColor = '#ffe600'; } else { ctx.shadowBlur = 8; ctx.shadowColor = '#39ff14'; }
                ctx.fillStyle = isHover ? 'rgba(255, 230, 0, 0.3)' : 'rgba(57, 255, 20, 0.15)'; 
                ctx.strokeStyle = isHover ? '#ffe600' : '#39ff14'; 
                ctx.lineWidth = 2; ctx.fillRect(-pxLen / 2, -pxWid / 2, pxLen, pxWid); ctx.strokeRect(-pxLen / 2, -pxWid / 2, pxLen, pxWid);
                ctx.beginPath(); ctx.moveTo(pxLen / 2, -pxWid / 4); ctx.lineTo(pxLen / 2 + 10, 0); ctx.lineTo(pxLen / 2, pxWid / 4); ctx.closePath(); 
                ctx.fillStyle = isHover ? '#ffe600' : '#39ff14'; ctx.fill(); ctx.restore(); 

                if (pt.isStop) { 
                    ctx.fillStyle = isHover ? '#ffe600' : '#ff2a2a'; ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
                    ctx.fillRect(pos.px - 4, pos.py - 4, 8, 8); ctx.shadowBlur = 0;
                } else { 
                    ctx.beginPath(); ctx.arc(pos.px, pos.py, 4, 0, Math.PI * 2); ctx.fillStyle = isHover ? '#ffe600' : '#39ff14'; 
                    ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle; ctx.fill(); ctx.shadowBlur = 0;
                } 

                let radHeadingIn = pt.heading * Math.PI / 180; let dirXIn = -Math.sin(radHeadingIn); let dirYIn = -Math.cos(radHeadingIn);
                ctx.beginPath(); ctx.moveTo(pos.px, pos.py); ctx.lineTo(pos.px + dirXIn * 16, pos.py + dirYIn * 16); ctx.strokeStyle = pt.isStop ? 'rgba(255,42,42,0.8)' : '#ff2a2a'; ctx.lineWidth = 2; ctx.stroke();

                if (index < keyWaypoints.length - 1 && !pt.disconnectNext) { 
                    let hOut = pt.headingOut !== undefined ? pt.headingOut : pt.heading; 
                    if (hOut !== pt.heading) {
                        let radHeadingOut = hOut * Math.PI / 180; let dirXOut = -Math.sin(radHeadingOut); let dirYOut = -Math.cos(radHeadingOut);
                        ctx.beginPath(); ctx.moveTo(pos.px, pos.py); ctx.lineTo(pos.px + dirXOut * 16, pos.py + dirYOut * 16); ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2; ctx.stroke(); 
                    }
                }
            }); 
        }

        function generateJavaCode() { 
            if (keyWaypoints.length === 0) { output.value = "// WAITING FOR DEPLOYMENT..."; return; } 
            let code = `// ==========================================\n// 🎯 PASS PLANNER | ETA: ${simTotalTime.toFixed(2)} SEC\n// ⚙️ BRAKE PID: P=${globalBrakePID.p}, I=${globalBrakePID.i}, D=${globalBrakePID.d}\n// ==========================================\n\n`; 
            pathSegments.forEach((seg, idx) => { 
                let realIndex = seg.waypointIndex;
                let maxA = keyWaypoints[realIndex].maxAccel !== undefined ? keyWaypoints[realIndex].maxAccel : 5.0;
                let msStart = keyWaypoints[realIndex].mainSpeedIsStart !== undefined ? keyWaypoints[realIndex].mainSpeedIsStart : true;
                let tOut = keyWaypoints[realIndex].tensionOut !== undefined ? keyWaypoints[realIndex].tensionOut : globalCurveWeight;
                let tIn = keyWaypoints[realIndex].tensionIn !== undefined ? keyWaypoints[realIndex].tensionIn : globalCurveWeight;
                
                code += `/* \nnew AutoMoveComplex(\n    m_drivetrain, \n    myPath.segments[${idx}].xArray, \n    myPath.segments[${idx}].yArray, \n    myPath.segments[${idx}].rotArray, \n    myPath.segments[${idx}].speedArray, \n    myPath.segments[${idx}].stopAtEnd, \n    false, false, \n    ${globalBrakePID.p}, ${globalBrakePID.i}, ${globalBrakePID.d}\n    // Accel: ${maxA}, MainSpeedAtStart: ${msStart}, tOut: ${tOut}, tIn: ${tIn}\n);\n*/\n\n`; 
            }); 
            output.value = code; 
        }
        function clearPoints() { keyWaypoints = []; pathSegments = []; hoveredIndex = -1; if(isSimulating) toggleSimulation(); renderRouteTimeline(); drawPoints(); generateJavaCode(); saveNameInput.value = ""; }
    </script>
